<style>

body.noanim *,body.noanim *::before{animation:none!important;transition:none!important}

const mc=(m,i)=>`<article class="card" style="--r:${(i%5-2)*.8}deg"><div class="pimg" data-a="view" data-id="${m.id}">${m.img?`<img src="${m.img}" alt="${esc(m.title)}">`:m.e||"💗"}</div><b>${esc(m.title)}</b><br><small>${fd(m.date)}${m.album?" · "+esc(m.album):""}</small><p>${esc(m.desc)}</p><div class="act"><button class="ic hrt ${m.fav?"on":""}" data-a="fav" data-id="${m.id}" aria-label="Favorite">${m.fav?"♥":"♡"}</button>${btns("mem",m.id)}</div></article>`;
const R={
home:()=>`<div class="hero"><svg class="heart" viewBox="0 0 100 90" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path d="M50 85C10 55 2 35 2 24 2 11 12 3 24 3c11 0 20 7 26 16C56 10 65 3 76 3c12 0 22 8 22 21 0 11-8 31-48 61z" fill="url(#hg)"/></svg><h1>Our Little Universe</h1><p>A little place for everything that makes us, us.</p><p>Welcome home, my love. Every memory, dream and victory of ours lives here, safe under the stars.</p></div><div class="tiles">${[["mem","📸","Our Memories","Photos, albums and favorites"],["love","💕","Things We Love","Everything that’s ours"],["dreams","🌙","Our Dreams","Goals for us, and for each of us"],["ach","🏆","Our Achievements","How far we’ve come"]].map(t=>`<a class="card" href="#${t[0]}">${t[1]}<b>${t[2]}</b><small>${t[3]}</small></a>`).join("")}</div>`,
mem(){const grid=L=>`<div class="grid">${L.map(mc).join("")}</div>`;let b;
if(!S.mem.length)b=empty("📷","No memories yet. Add your first photo of us!");
else if(memF=="all"){const f=S.mem.filter(m=>m.fav),o=S.mem.filter(m=>!m.fav);b=(f.length?`<h3 class="sh">♥ Favorite Memories</h3>${grid(f)}`:"")+(o.length?`<h3 class="sh">All Our Moments</h3>${grid(o)}`:"")}
else{const L=S.mem.filter(m=>memF=="♥"?m.fav:m.album==memF);b=L.length?grid(L):empty("🌸","Nothing in here yet.")}
return hd("Our Memories 📸","A scrapbook of the moments we never want to forget.")+`<div class="bar2">${chip("All","mf","all",memF=="all")}${chip("♥ Favorites","mf","♥",memF=="♥")}${albums().map(a=>chip(a,"mf",a,memF==a)).join("")}<button class="b" data-a="addmem">＋ Add memory</button></div>`+b},
love(){if(!S.cats.includes(loveC))loveC=S.cats[0];const L=S.items.filter(i=>i.cat==loveC);
return hd("Things We Love 💕","Our favorite things, collected one by one.")+`<div class="bar2">${S.cats.map(c=>chip(c,"lc",c,c==loveC)).join("")}<button class="chip" data-a="addcat">＋ New category</button></div><div class="bar2"><button class="b" data-a="additems">＋ Add to “${esc(loveC||"…")}”</button>${S.cats.length?`<button class="b ghost" data-a="delcat">Remove category</button>`:""}</div>`+(!S.cats.length?empty("🌷","Create a category to get started."):L.length?`<div class="grid">${L.map((i,n)=>`<article class="card" style="--r:${(n%3-1)}deg">${i.img?`<div class="pimg" data-a="viewitem" data-id="${i.id}"><img src="${i.img}" alt=""></div>`:""}<b>${esc(i.name)}</b><p>${esc(i.desc)}</p><div class="act"><span>💗</span>${btns("items",i.id)}</div></article>`).join("")}</div>`:empty("💞","Nothing here yet. What do we love about this?"))},
dreams(){const D=[["us","Our Goals Together","💞","Dreams we chase side by side"],["her","Her Personal Goals","🌸","Her ambitions, cheered on by me"],["me","My Personal Goals","🌙","My ambitions, cheered on by her"]];
return hd("Our Dreams & Goals 🌙","The future we’re building, one small step at a time.")+`<div class="cols">${D.map(d=>{const L=S.goals.filter(g=>g.who==d[0]);return`<section class="col"><div class="top"><div><h3>${d[2]} ${d[1]}</h3><small>${d[3]}</small></div><button class="b" data-a="addgoal" data-id="${d[0]}">＋</button></div>${L.length?L.map(g=>`<div class="card ${g.status=="Completed"?"done":""}"><div class="top"><b>${esc(g.title)}</b><span class="pill ${g.status=="Completed"?"c":""}">${g.status}</span></div>${g.desc?`<p>${esc(g.desc)}</p>`:""}${g.date?`<small>🎯 ${fd(g.date)}</small>`:""}<div class="bar"><i data-w="${g.progress}"></i></div><div class="act"><small>${g.progress}%</small>${btns("goals",g.id,(g.status!="Completed"?`<button class="ic" data-a="bump" data-id="${g.id}" aria-label="Add 10%">＋10%</button>`:d[0]=="us"?`<button class="ic" data-a="toach" data-id="${g.id}" title="Add to achievements">🏆</button>`:""))}</div></div>`).join(""):empty("⭐","No goals yet. Dream a little!")}</section>`}).join("")}</div>`},
ach(){const L=S.ach.filter(a=>achF=="all"||a.cat==achF).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
return hd("Our Achievements 🏆","Proof of how much we’ve grown together.")+`<div class="bar2">${chip("All","af","all",achF=="all")}${AC.map((c,i)=>chip(AI[i]+" "+c,"af",c,achF==c)).join("")}<button class="b" data-a="addach">＋ Add achievement</button></div>`+(L.length?`<div class="tl">${L.map(a=>{const i=Math.max(0,AC.indexOf(a.cat));return`<article class="tli"><div class="bdg" style="--c:${AK[i]}">${AI[i]}</div><div class="card"><div class="top"><b>${esc(a.title)}</b>${btns("ach",a.id)}</div><small>${fd(a.date)} · ${esc(a.cat)}</small><p>${esc(a.desc)}</p>${a.img?`<img src="${a.img}" alt="">`:""}</div></article>`}).join("")}</div>`:empty("🌱","Nothing here yet. Your story starts with one small win."))}};
function render(){$("#app").innerHTML=`<section class="pg pg-${page}">${R[page]()}</section>`;document.querySelectorAll("nav [data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p==page));document.querySelectorAll(".bar i").forEach(i=>{requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=i.dataset.w+"%"))})}
const ACT={
mf:id=>{memF=id;render()},lc:id=>{loveC=id;render()},af:id=>{achF=id;render()},
addmem:()=>add("mem","Add a memory",MF(),{date:today()}),emem:id=>edit("mem",id,"Edit memory",MF()),dmem:id=>del("mem",id),
fav:(id,b)=>{const m=find("mem",id);m.fav=!m.fav;save();const r=b.getBoundingClientRect();if(m.fav)burst(r.left+r.width/2,r.top,["💗","💖","💕"]);render()},
view:id=>{const m=find("mem",id);modal(`${m.img?`<img src="${m.img}" alt="${esc(m.title)}">`:`<div class="big">${m.e||"💗"}</div>`}<h3>${esc(m.title)}</h3><small>${fd(m.date)} ${esc(m.album||"")}</small><p>${esc(m.desc)}</p>`,"lb")},
viewitem:id=>{const m=find("items",id);modal(`<img src="${m.img}" alt=""><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p>`,"lb")},
additems:()=>S.cats.length&&add("items","Add something we love",LF(),{cat:loveC}),eitems:id=>edit("items",id,"Edit",LF()),ditems:id=>del("items",id),
addcat:()=>form("New category",[{k:"n",l:"Category name",r:1}],{},o=>{const n=o.n.trim();if(n&&!S.cats.includes(n))S.cats.push(n);loveC=n;save();render()}),
delcat:()=>ask("Remove “"+esc(loveC)+"” and everything in it?",()=>{S.cats=S.cats.filter(c=>c!=loveC);S.items=S.items.filter(i=>i.cat!=loveC);save();render()}),
addgoal:who=>form("Add a goal",GF,{status:"Not Started",progress:0},o=>{fix("goals",o);S.goals.unshift({...o,who,id:uid(),ts:Date.now()});save();render();if(o.status=="Completed")mid()}),
egoals:id=>edit("goals",id,"Edit goal",GF),dgoals:id=>del("goals",id),
bump:id=>{const g=find("goals",id);g.progress=Math.min(100,g.progress+10);fix("goals",g);save();render();if(g.status=="Completed")mid()},
toach:id=>{const g=find("goals",id);S.ach.unshift({id:uid(),ts:Date.now(),cat:AC[0],title:g.title,desc:g.desc,date:today()});save();achF=AC[0];location.hash="ach";mid()},
addach:()=>add("ach","Add an achievement",AF(),{date:today(),cat:AC.includes(achF)?achF:AC[1]}),each:id=>edit("ach",id,"Edit achievement",AF()),dach:id=>del("ach",id)};
$("#app").onclick=e=>{const b=e.target.closest("[data-a]");if(b)ACT[b.dataset.a]?.(b.dataset.id,b)};
addEventListener("keydown",e=>{if(e.key=="Escape")document.querySelector(".ov:last-of-type")?.remove()});
function go(){const h=location.hash.slice(1);page=R[h]?h:"home";render();scrollTo(0,0)}addEventListener("hashchange",go);
/* background */
const cv=$("#bg"),cx=cv.getContext("2d");let W,H,P=[],T=[],raf,dk;
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;dk=matchMedia("(prefers-color-scheme:dark)").matches};addEventListener("resize",rs);rs();
const mk=k=>({k,x:Math.random()*W,y:Math.random()*H,s:k=="s"?Math.random()*1.5+.5:Math.random()*7+6,v:Math.random()*.6+.3,a:Math.random()*6.28,w:Math.random()*.02+.006});
for(let i=0;i<70;i++)P.push(mk("s"));for(let i=0;i<14;i++)P.push(mk("p"));for(let i=0;i<7;i++)P.push(mk("f"));
function draw(){cx.clearRect(0,0,W,H);for(const p of P){p.a+=p.w;if(p.k=="s"){cx.globalAlpha=.25+.6*Math.abs(Math.sin(p.a*3));cx.fillStyle=dk?"#fff":"#c084fc";cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.3);cx.fill();continue}
p.y+=p.v;p.x+=Math.sin(p.a)*.6;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}cx.globalAlpha=.55;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.k=="p"?"#f9a8d4":"#e9d5ff";
if(p.k=="p"){cx.beginPath();cx.ellipse(0,0,p.s,p.s/2,0,0,6.3);cx.fill()}else{for(let j=0;j<5;j++){cx.rotate(1.2566);cx.beginPath();cx.arc(p.s/2,0,p.s/3,0,6.3);cx.fill()}cx.fillStyle="#fde68a";cx.beginPath();cx.arc(0,0,p.s/4,0,6.3);cx.fill()}cx.restore()}
cx.fillStyle="#f472b6";for(const t of T){t.l-=.03;cx.globalAlpha=Math.max(0,t.l*.6);cx.beginPath();cx.arc(t.x,t.y,4*t.l,0,6.3);cx.fill()}T=T.filter(t=>t.l>0)}
function loop(){if(!on())return;draw();raf=requestAnimationFrame(loop)}
function setAnim(){cancelAnimationFrame(raf);document.body.classList.toggle("noanim",!on());$("#tg").setAttribute("aria-pressed",S.anim!==false);$("#tg").textContent=S.anim!==false?"✨ Magic on":"✨ Magic off";if(on())loop();else cx.clearRect(0,0,W,H)}
$("#tg").onclick=()=>{S.anim=S.anim===false;save();setAnim()};
addEventListener("mousemove",e=>{if(on()&&T.length<40)T.push({x:e.clientX,y:e.clientY,l:1})});
(async()=>{S=await DB.get()||seed();if(!S.cats)S.cats=[...CATS];await save();setAnim();go();connect()})();
</script></body></html>
